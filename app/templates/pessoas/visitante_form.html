{% extends "base.html" %}
{% block conteudo %}
<h3>Visitante</h3>
<p class="text-muted">Visitante não vai pra catraca: a recepção registra e libera manualmente (fica no log).</p>
<form method="post" class="col-lg-5">
  <div class="mb-2"><label class="form-label">Nome</label><input class="form-control" name="nome" required autofocus></div>
  <div class="mb-3"><label class="form-label">Documento</label><input class="form-control" name="documento"></div>
  <button class="btn btn-primary">Registrar e ir para a Recepção</button>
</form>
{% endblock %}
