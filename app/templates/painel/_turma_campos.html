<div class="col-md-6"><input class="form-control form-control-sm" name="nome" placeholder="Nome (ex. Pré 1 A)" value="{{ v.nome if v else '' }}" required></div>
<div class="col-md-6"><select class="form-select form-select-sm" name="turno">{% for k in ['manha','tarde','integral'] %}<option value="{{ k }}" {{ 'selected' if v and v.turno == k }}>{{ k }}</option>{% endfor %}</select></div>
<div class="col-md-3"><label class="form-label small mb-0">Entrada de</label><input class="form-control form-control-sm" type="time" name="entrada_inicio" value="{{ v.entrada_inicio.strftime('%H:%M') if v else '06:30' }}"></div>
<div class="col-md-3"><label class="form-label small mb-0">Início da aula</label><input class="form-control form-control-sm" type="time" name="entrada_fim" value="{{ v.entrada_fim.strftime('%H:%M') if v else '08:00' }}"></div>
<div class="col-md-3"><label class="form-label small mb-0">Saída de</label><input class="form-control form-control-sm" type="time" name="saida_inicio" value="{{ v.saida_inicio.strftime('%H:%M') if v else '16:30' }}"></div>
<div class="col-md-3"><label class="form-label small mb-0">Saída até</label><input class="form-control form-control-sm" type="time" name="saida_fim" value="{{ v.saida_fim.strftime('%H:%M') if v else '18:30' }}"></div>
<div class="col-md-4"><label class="form-label small mb-0">Tolerância (min)</label><input class="form-control form-control-sm" type="number" name="tolerancia_entrada_min" value="{{ v.tolerancia_entrada_min if v else 15 }}"></div>
<div class="col-md-8"><label class="form-label small mb-0">Saída</label><select class="form-select form-select-sm" name="exige_responsavel_saida"><option value="1" {{ 'selected' if not v or v.exige_responsavel_saida }}>Só com responsável identificado</option><option value="0" {{ 'selected' if v and not v.exige_responsavel_saida }}>Autônoma na janela de saída</option></select></div>
{% if v %}<div class="col-md-4"><select class="form-select form-select-sm" name="ativo"><option value="1" {{ 'selected' if v.ativo }}>ativa</option><option value="0" {{ 'selected' if not v.ativo }}>inativa</option></select></div>{% endif %}
